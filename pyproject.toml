[build-system]
requires = ["setuptools==68.1.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "web-data-collector"
version = "0.3.0"
description = "웹 데이터 수집기 — 웹 목록 수집과 Excel 저장"
requires-python = ">=3.10"
authors = [{name = "SIONLAB"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = ["beautifulsoup4==4.15.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
browser = ["playwright==1.61.0"]

[project.scripts]
web-data-collector = "sionlab_web_collector.cli:main"
sionlab-web-collector = "sionlab_web_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
